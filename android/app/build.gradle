plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.dobby.control'
    compileSdk 34

    defaultConfig {
        applicationId "com.dobby.control"
        minSdk 19           // Android 4.4 KitKat — couvre tous les Galaxy J1
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file("$rootDir/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        abortOnError false      // APK sideload : ne pas bloquer sur les avertissements NewApi
    }
}

dependencies {
    // Aucune bibliothèque AndroidX : elles imposent Android 5+. Tout en composants système.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
}
